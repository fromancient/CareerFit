services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: careerfit-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: careerfit
      POSTGRES_PASSWORD: careerfit
      POSTGRES_DB: careerfit
    volumes:
      - careerfit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerfit -d careerfit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  careerfit_pgdata:
